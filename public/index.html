<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeOs</title>
</head>
<body style="font-family: Comic Sans MS, cursive; background:#ffffff; color:#111111; margin:0; overflow:hidden; height:100vh;">

<style>
/* minimalni funkcni CSS - zadny design, jen aby OS fungoval */
*{margin:0;padding:0;box-sizing:border-box}
.hidden{display:none!important}
.minimized{display:none!important}
#desktop{position:absolute;top:0;left:0;right:0;bottom:28px;overflow:hidden}
.window{position:absolute;border:1px solid #999;min-width:200px;min-height:120px;display:flex;flex-direction:column;background:#fff}
.window-titlebar{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;cursor:move;background:#e0e0e0;border-bottom:1px solid #999;user-select:none;flex-shrink:0}
.window-controls{display:flex;gap:4px}
.win-btn{width:20px;height:20px;border:1px solid #999;background:#fff;cursor:pointer;font-size:12px;line-height:20px;text-align:center;padding:0}
.window-content{flex:1;overflow:auto;padding:8px}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:28px;display:flex;align-items:center;padding:0 8px;gap:4px;z-index:9999;border-top:1px solid #ccc;background:#fff}
.taskbar-app{padding:2px 8px;border:1px solid #999;background:#fff;cursor:pointer;font-size:11px}
.context-menu{position:absolute;z-index:10000}
.sb-popover{position:absolute;z-index:10000;border:1px solid #999;background:#fff;padding:8px;width:180px}
#spotlight-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:99999;display:flex;justify-content:center;padding-top:20vh}
#spotlight-box{width:400px;border:1px solid #999;background:#fff;padding:8px}
#spotlight-input{width:100%;padding:8px;border:1px solid #999;font-size:16px}
#spotlight-results{margin-top:4px}
.spotlight-item{padding:6px 8px;cursor:pointer;border:1px solid transparent}
.spotlight-item:hover{border-color:#999}
#snap-preview{position:absolute;border:2px dashed #999;background:rgba(0,0,0,0.05);pointer-events:none;z-index:50}
.desktop-icons{position:absolute;top:8px;left:8px;right:8px;bottom:8px}
.icon{position:absolute;width:70px;text-align:center;cursor:pointer;padding:8px 4px}
.icon img{width:40px;height:40px;display:block;margin:0 auto 4px}
.icon span{font-size:11px;word-break:break-word}
.resize-handle{position:absolute;width:8px;height:8px}
.resize-se{right:0;bottom:0;cursor:se-resize}
.resize-sw{left:0;bottom:0;cursor:sw-resize}
.resize-ne{right:0;top:0;cursor:ne-resize}
.resize-nw{left:0;top:0;cursor:nw-resize}
.resize-e{right:0;top:50%;transform:translateY(-50%);cursor:e-resize}
.resize-w{left:0;top:50%;transform:translateY(-50%);cursor:w-resize}
.resize-s{bottom:0;left:50%;transform:translateX(-50%);cursor:s-resize}
.resize-n{top:0;left:50%;transform:translateX(-50%);cursor:n-resize}
.chamfer{border-radius:4px}
.chamfer-sm{border-radius:4px}
.paint-app{display:flex;flex-direction:column;height:100%}
.paint-toolbar{display:flex;gap:4px;padding:4px;border-bottom:1px solid #ccc;flex-shrink:0}
.paint-color{width:20px;height:20px;border:1px solid #999;cursor:pointer;padding:0}
.paint-clear{padding:2px 8px;border:1px solid #999;background:#fff;cursor:pointer;font-size:11px}
.paint-canvas{flex:1;cursor:crosshair;border:1px solid #eee}
.clock-app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
.clock-canvas{border:1px solid #999}
.clock-digital{font-family:monospace;font-size:18px}
.files-app{display:flex;flex-direction:column;height:100%}
.files-toolbar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #ccc;flex-shrink:0}
.files-up{border:1px solid #999;background:#fff;cursor:pointer;padding:2px 8px;font-size:11px}
.files-path{font-family:monospace;font-size:12px}
.files-list{flex:1;overflow:auto}
</style>

  <!-- uvodni obrazovka -->
  <div id="welcome">
    <div class="welcome-card">
      <div class="welcome-logo">FreeOs</div>
      <h1>Welcome aboard</h1>
      <p class="welcome-sub">Your own little operating system, living right inside the browser.</p>
      <p class="welcome-hint">click anywhere to enter</p>
    </div>
  </div>

  <div id="context-menu" class="hidden chamfer-sm">
    <button class="ctx-item" data-action="refresh"><span class="ci-icon">↻</span> Refresh</button>
    <button class="ctx-item" data-action="arrange"><span class="ci-icon">▦</span> Arrange Icons</button>
    <button class="ctx-item" data-action="wallpaper"><span class="ci-icon">▨</span> Change Wallpaper</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" data-action="about"><span class="ci-icon">i</span> About FreeOs</button>
  </div>

  <div id="spotlight-overlay" class="hidden">
    <div id="spotlight-box" class="chamfer">
      <input id="spotlight-input" type="text" placeholder="Search apps..." autocomplete="off">
      <div id="spotlight-results"></div>
    </div>
  </div>

  <div id="desktop">
    <div id="snap-preview" class="hidden"></div>
    <div id="selection-box"></div>
    <div class="desktop-glow"></div>

    <div class="desktop-icons">
      <div class="icon" data-app="notepad" tabindex="0">
        <span>About Me</span>
      </div>
      <div class="icon" data-app="calculator" tabindex="0">
        <span>Calc</span>
      </div>
      <div class="icon" data-app="settings" tabindex="0">
        <span>Settings</span>
      </div>
      <div class="icon" data-app="console" tabindex="0">
        <span>Console</span>
      </div>
      <div class="icon" data-app="browser" tabindex="0">
        <span>Browser</span>
      </div>
      <div class="icon" data-app="snake" tabindex="0">
        <span>Snake</span>
      </div>
      <div class="icon" data-app="paint" tabindex="0">
        <span>Paint</span>
      </div>
      <div class="icon" data-app="clock" tabindex="0">
        <span>Clock</span>
      </div>
      <div class="icon" data-app="files" tabindex="0">
        <span>Files</span>
      </div>
    </div>
  </div>

  <template id="tpl-window">
    <div class="window chamfer" tabindex="0">
      <div class="window-titlebar">
        <span class="window-title">App</span>
        <div class="window-controls">
          <button class="win-btn minimize" aria-label="Minimize">─</button>
          <button class="win-btn maximize" aria-label="Maximize">□</button>
          <button class="win-btn close" aria-label="Close">×</button>
        </div>
      </div>
      <div class="window-content"></div>
      <div class="resize-handle resize-se"></div>
      <div class="resize-handle resize-sw"></div>
      <div class="resize-handle resize-ne"></div>
      <div class="resize-handle resize-nw"></div>
      <div class="resize-handle resize-e"></div>
      <div class="resize-handle resize-w"></div>
      <div class="resize-handle resize-s"></div>
      <div class="resize-handle resize-n"></div>
    </div>
  </template>

  <template id="tpl-notepad">
    <textarea class="notepad-area" placeholder="write about urself here..."></textarea>
  </template>

  <template id="tpl-calculator">
    <div class="calc-grid">
      <div class="calc-display">0</div>
      <button class="calc-btn op" data-action="clear">C</button>
      <button class="calc-btn op" data-action="sign">±</button>
      <button class="calc-btn op" data-action="percent">%</button>
      <button class="calc-btn op" data-action="divide">÷</button>
      <button class="calc-btn">7</button>
      <button class="calc-btn">8</button>
      <button class="calc-btn">9</button>
      <button class="calc-btn op" data-action="multiply">×</button>
      <button class="calc-btn">4</button>
      <button class="calc-btn">5</button>
      <button class="calc-btn">6</button>
      <button class="calc-btn op" data-action="subtract"></button>
      <button class="calc-btn">1</button>
      <button class="calc-btn">2</button>
      <button class="calc-btn">3</button>
      <button class="calc-btn op" data-action="add">+</button>
      <button class="calc-btn zero">0</button>
      <button class="calc-btn">.</button>
      <button class="calc-btn op equals" data-action="equals">=</button>
    </div>
  </template>

  <template id="tpl-settings">
    <div class="settings-panel">
      <h3>Appearance</h3>
      <label class="setting-row">
        <span>Accent color</span>
        <input type="color" id="accent-picker" value="#ff6a39">
      </label>
      <label class="setting-row">
        <span>Glass effect</span>
        <input type="checkbox" id="glass-toggle" checked>
      </label>
      <label class="setting-row">
        <span>Animations</span>
        <input type="checkbox" id="anim-toggle" checked>
      </label>
      <h3 class="settings-subhead">Desktop</h3>
      <div class="setting-row setting-row--stack">
        <span>Wallpaper</span>
        <div id="wallpaper-grid" class="wallpaper-grid"></div>
      </div>
    </div>
  </template>

  <template id="tpl-console">
    <div class="console-app">
      <div class="console-output"></div>
      <div class="console-input-row">
        <span class="console-prompt">&gt;</span>
        <input class="console-input" type="text" spellcheck="false" autocomplete="off" autofocus>
      </div>
    </div>
  </template>

  <template id="tpl-browser">
    <div class="browser-app">
      <div class="browser-toolbar">
        <input class="browser-url" type="text" placeholder="Enter URL..." value="https://wikipedia.org" autocomplete="off">
        <button class="browser-go">Go</button>
      </div>
      <iframe class="browser-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" src="https://wikipedia.org"></iframe>
    </div>
  </template>

  <template id="tpl-snake">
    <div class="snake-app">
      <div class="snake-bar">Score: <span class="snake-score">0</span></div>
      <canvas class="snake-canvas"></canvas>
      <div class="snake-hint">Use arrows / WASD. Click to start.</div>
    </div>
  </template>

  <template id="tpl-paint">
    <div class="paint-app">
      <div class="paint-toolbar">
        <button class="paint-color" data-color="#000000" style="background:#000"></button>
        <button class="paint-color" data-color="#ff0000" style="background:#ff0000"></button>
        <button class="paint-color" data-color="#0000ff" style="background:#0000ff"></button>
        <button class="paint-color" data-color="#00aa00" style="background:#00aa00"></button>
        <button class="paint-color" data-color="#ff6600" style="background:#ff6600"></button>
        <button class="paint-color" data-color="#ffffff" style="background:#ffffff;border:1px solid #999">X</button>
        <button class="paint-clear">Clear</button>
      </div>
      <canvas class="paint-canvas" width="460" height="280"></canvas>
    </div>
  </template>

  <template id="tpl-clock">
    <div class="clock-app">
      <canvas class="clock-canvas" width="200" height="200"></canvas>
      <div class="clock-digital"></div>
    </div>
  </template>

  <template id="tpl-files">
    <div class="files-app">
      <div class="files-toolbar">
        <button class="files-up" disabled>↑ Up</button>
        <span class="files-path">/</span>
      </div>
      <div class="files-list"></div>
    </div>
  </template>

  <div id="taskbar">
    <div class="taskbar-start">
      <button class="start-btn" aria-label="Start">●</button>
      <div id="open-apps"></div>
    </div>
    <div class="taskbar-tray">
      <div id="clock">--:--:--</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
